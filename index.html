<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura | Professional NFC Connections</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:ital,wght@1,900&family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
      /* Zero-latency initial styles to boot background instantly */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        color: #ffffff;
        overflow: hidden;
      }
      
      .initial-loader-container {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: col;
        align-items: center;
        justify-content: center;
        background-color: #000000;
        z-index: 9999;
      }

      .initial-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 40px; /* equivalent to gap-10 */
      }

      .initial-logo {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 40px;
        letter-spacing: 0.12em;
        color: #ffffff;
        margin: 0;
        opacity: 0;
        animation: fadeInDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @media (min-width: 640px) {
        .initial-logo {
          font-size: 48px;
        }
      }

      .initial-spinner {
        position: relative;
        width: 56px; /* equivalent to w-14 */
        height: 56px; /* equivalent to h-14 */
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      }

      .spinner-bg {
        position: absolute;
        inset: 0;
        border: 2px solid rgba(39, 39, 42, 0.6); /* equivalent to border-zinc-900/60 */
        border-radius: 50%;
      }

      .spinner-active {
        position: absolute;
        inset: 0;
        border: 2px solid transparent;
        border-top-color: #c5a059; /* aura-gold */
        border-right-color: rgba(197, 160, 89, 0.2); /* aura-gold/20 */
        border-radius: 50%;
        animation: spin 1.0s linear infinite;
      }

      .initial-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 750;
        font-size: 11px;
        letter-spacing: 0.3em;
        color: #a1a1aa; /* text-zinc-400 */
        margin: 8px 0 0 0;
        opacity: 0;
        animation: fadeIn 0.5s ease 0.2s forwards;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes fadeInDown {
        0% {
          opacity: 0;
          transform: translateY(-10px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes scaleIn {
        0% {
          opacity: 0;
          transform: scale(0.8);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Embedded, zero-latency skeleton loader matching premium AURA theme -->
      <div class="initial-loader-container">
        <div class="initial-loader-content">
          <h1 class="initial-logo">AURA</h1>
          <div class="initial-spinner">
            <div class="spinner-bg"></div>
            <div class="spinner-active"></div>
          </div>
          <p class="initial-text">LOADING AURA</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
